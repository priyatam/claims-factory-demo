[project]
name = "vehicle-claims"
version = "0.1.0"
description = "Vehicle claims Strands harness on Amazon Bedrock AgentCore Runtime"
requires-python = ">=3.12"
dependencies = [
  "bedrock-agentcore>=1.23",
  "strands-agents>=1.0",
  "httpx>=0.27",
  "boto3>=1.35",
  "aws-opentelemetry-distro>=0.18.0",
  "strands-agents-evals>=1.4.0",
  "rich>=13",
]

[dependency-groups]
# Only for deploy.py and tests on the machine running cdk.
dev = [
  "pytest>=8",
  "aws-cdk-lib>=2.270",
  "constructs>=10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["prod: calls the deployed stack and real Bedrock; the unit-test gate is off for it"]
norecursedirs = [".venv", "cdk.out", ".build", ".*"]
