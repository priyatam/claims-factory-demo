<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1520" role="img" aria-label="Control Plane, Execution Plane, and Data Plane. AgentCore Runtime wraps Strands agents and Bedrock. AgentCore Gateway MCP reaches an external partner integration layer for policy, LexisNexis, insurance, and estimating facts. Adjuster sits outside the planes. OpenTelemetry traces to CloudWatch. History feeds SFT before production; live accept/correct pairs feed scheduled retrain; offline and realtime eval scores gate promotion.">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .pt { font-size: 18px; font-weight: 700; fill: #111; }
    .ps { font-size: 13px; fill: #333; }
    .h { font-size: 15px; font-weight: 700; fill: #fff; }
    .s { font-size: 12px; fill: #f3f3f3; }
    .lab { font-size: 13px; font-weight: 700; fill: #111; stroke: #fff; stroke-width: 4px; paint-order: stroke fill; }
    .band { fill: none; stroke: #111; stroke-width: 2; stroke-dasharray: 8 5; }
    .sec { fill: #7a1f2b; stroke: #4a1018; }
    .net { fill: #3d2f6b; stroke: #241a40; }
    .run { fill: #1a3d6e; stroke: #102848; }
    .run-inner { fill: #245a96; stroke: #102848; }
    .ai { fill: #0e4f45; stroke: #08332c; }
    .model { fill: #1a7a6a; stroke: #08332c; stroke-width: 1.2; }
    .human { fill: #4a3728; stroke: #2c2118; }
    .db { fill: #243044; stroke: #111; }
    .store { fill: #3d4f1f; stroke: #243010; }
    .gw { fill: #14573a; stroke: #0c3a26; }
    .partner { fill: #1a4a5e; stroke: #0f2f3c; }
    .partner-row { fill: #256078; stroke: #0f2f3c; }
    .partner-row2 { fill: #1e5570; stroke: #0f2f3c; }
    .obs { fill: #5c3d14; stroke: #3a260c; }
    .train { fill: #5c2d6e; stroke: #3a1a48; }
    .wire { fill: none; stroke: #111; stroke-width: 1.7; marker-end: url(#ah); }
    .mcp { fill: none; stroke: #14573a; stroke-width: 2.1; marker-end: url(#ah-mcp); }
    .otel { fill: none; stroke: #8a5a12; stroke-width: 2; stroke-dasharray: 5 4; marker-end: url(#ah-trace); }
    .loop { fill: none; stroke: #5c2d6e; stroke-width: 2.2; }
    .loopend { fill: none; stroke: #5c2d6e; stroke-width: 2.2; marker-end: url(#ah-loop); }
    .sil { fill: #4a3728; }
  </style>
  <defs>
    <marker id="ah" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0 0 L11 4 L0 8 Z" fill="#111"/>
    </marker>
    <marker id="ah-mcp" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0 0 L11 4 L0 8 Z" fill="#14573a"/>
    </marker>
    <marker id="ah-trace" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0 0 L11 4 L0 8 Z" fill="#8a5a12"/>
    </marker>
    <marker id="ah-loop" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0 0 L11 4 L0 8 Z" fill="#5c2d6e"/>
    </marker>
  </defs>
  <rect width="1400" height="1520" fill="#fff"/>

  <!-- Control plane -->
  <rect class="band" x="48" y="20" width="1080" height="230" rx="10"/>
  <text class="pt" x="64" y="48">Control Plane</text>
  <text class="ps" x="220" y="48">security and networking</text>

  <rect class="sec" x="64" y="66" width="248" height="164" rx="8"/>
  <text class="h" x="188" y="118" text-anchor="middle">AgentCore Identity</text>
  <text class="s" x="188" y="146" text-anchor="middle">who may call the runtime</text>
  <text class="s" x="188" y="166" text-anchor="middle">outbound credentials</text>

  <rect class="sec" x="328" y="66" width="248" height="164" rx="8"/>
  <text class="h" x="452" y="118" text-anchor="middle">IAM, Secrets Manager</text>
  <text class="s" x="452" y="146" text-anchor="middle">runtime role</text>
  <text class="s" x="452" y="166" text-anchor="middle">key never written on the claim</text>

  <rect class="net" x="592" y="66" width="248" height="164" rx="8"/>
  <text class="h" x="716" y="110" text-anchor="middle">VPC, PrivateLink</text>
  <text class="s" x="716" y="138" text-anchor="middle">private subnet, security groups</text>
  <text class="s" x="716" y="158" text-anchor="middle">endpoints for Bedrock, S3,</text>
  <text class="s" x="716" y="178" text-anchor="middle">Amazon RDS, CloudWatch</text>

  <rect class="net" x="856" y="66" width="248" height="164" rx="8"/>
  <text class="h" x="980" y="118" text-anchor="middle">WAF, API Gateway</text>
  <text class="s" x="980" y="146" text-anchor="middle">only public front door</text>
  <text class="s" x="980" y="166" text-anchor="middle">TLS, private URL refused</text>

  <path class="wire" d="M360 250 V294"/>
  <text class="lab" x="372" y="278">governs</text>

  <!-- Execution plane -->
  <rect class="band" x="48" y="298" width="1080" height="250" rx="10"/>
  <text class="pt" x="64" y="326">Execution Plane</text>
  <text class="ps" x="236" y="326">Strands on AgentCore, one microVM per claim</text>

  <!-- AgentCore Runtime wrapper -->
  <rect class="run" x="64" y="344" width="1040" height="184" rx="8"/>
  <text class="h" x="84" y="370">AgentCore Runtime</text>
  <text class="s" x="280" y="370">microVM per claim · ENI in the private subnet</text>

  <rect class="run-inner" x="84" y="386" width="490" height="120" rx="8"/>
  <text class="h" x="329" y="432" text-anchor="middle">Strands Agents</text>
  <text class="s" x="329" y="458" text-anchor="middle">triage · read · validation</text>
  <text class="s" x="329" y="478" text-anchor="middle">one claim context</text>

  <rect class="ai" x="594" y="386" width="490" height="120" rx="8"/>
  <text class="h" x="839" y="424" text-anchor="middle">Bedrock</text>
  <text class="s" x="839" y="450" text-anchor="middle">InvokeModel · vision read</text>
  <!-- model endpoints (generic; choice not pinned) -->
  <circle class="model" cx="799" cy="482" r="7"/>
  <circle class="model" cx="839" cy="482" r="7"/>
  <circle class="model" cx="879" cy="482" r="7"/>
  <text class="s" x="904" y="486">models</text>

  <path class="wire" d="M574 446 H594"/>

  <!-- Adjuster outside planes -->
  <path class="wire" d="M1104 436 H1168"/>
  <circle class="sil" cx="1228" cy="400" r="18"/>
  <path class="sil" d="M1194 468 C1194 440 1206 428 1228 428 C1250 428 1262 440 1262 468 L1262 492 L1194 492 Z"/>
  <text class="lab" x="1228" y="520" text-anchor="middle">Adjuster</text>
  <text class="ps" x="1228" y="540" text-anchor="middle">accepts / corrects</text>

  <!-- MCP: Execution → AgentCore Gateway -->
  <path class="mcp" d="M329 548 V640 H940 V688"/>
  <text class="lab" x="500" y="632" text-anchor="middle">MCP</text>

  <!-- Data plane (stores + gateway; partners sit outside) -->
  <rect class="band" x="48" y="560" width="1080" height="250" rx="10"/>
  <text class="pt" x="64" y="588">Data Plane</text>
  <text class="ps" x="190" y="588">claim, history, MCP gateway</text>

  <rect class="db" x="64" y="608" width="340" height="180" rx="8"/>
  <text class="h" x="234" y="668" text-anchor="middle">Amazon RDS</text>
  <text class="s" x="234" y="696" text-anchor="middle">claim item, written once</text>
  <text class="s" x="234" y="716" text-anchor="middle">up to 3 years of closed files</text>

  <rect class="store" x="420" y="608" width="340" height="180" rx="8"/>
  <text class="h" x="590" y="668" text-anchor="middle">S3</text>
  <text class="s" x="590" y="696" text-anchor="middle">photo for the run</text>
  <text class="s" x="590" y="716" text-anchor="middle">deleted, unless labeled</text>

  <rect class="gw" x="776" y="608" width="328" height="180" rx="8"/>
  <text class="h" x="940" y="648" text-anchor="middle">AgentCore Gateway</text>
  <text class="s" x="940" y="676" text-anchor="middle">MCP, authn and authz</text>
  <text class="s" x="940" y="696" text-anchor="middle">every call to partners</text>
  <text class="s" x="940" y="716" text-anchor="middle">facts land on the claim</text>
  <text class="s" x="940" y="736" text-anchor="middle">null stays null</text>

  <!-- Observability outside planes: OTEL → CloudWatch -->
  <text class="lab" x="1240" y="640" text-anchor="middle">OpenTelemetry</text>
  <path class="otel" d="M1240 652 V700"/>
  <rect class="obs" x="1140" y="710" width="220" height="100" rx="8"/>
  <text class="h" x="1250" y="748" text-anchor="middle">CloudWatch</text>
  <text class="s" x="1250" y="772" text-anchor="middle">one OTEL trace per claim</text>
  <text class="s" x="1250" y="792" text-anchor="middle">plate is not in the span</text>
  <path class="otel" d="M1104 470 C1120 470 1140 560 1140 640 V710"/>

  <!-- MCP: Gateway → Partner integration (outside Data band) -->
  <path class="mcp" d="M940 788 V828"/>
  <text class="lab" x="960" y="816">MCP</text>

  <!-- Partner integration adjunct (outside Data plane) -->
  <rect class="partner" x="420" y="828" width="684" height="228" rx="8"/>
  <text class="h" x="762" y="854" text-anchor="middle">Partner integration</text>
  <text class="s" x="762" y="874" text-anchor="middle">external providers · notice / policy / industry facts → claim</text>

  <rect class="partner-row" x="440" y="888" width="644" height="36" rx="4"/>
  <text class="h" x="762" y="911" text-anchor="middle">Policy data — coverage, deductible, named vehicle</text>

  <rect class="partner-row2" x="440" y="928" width="644" height="36" rx="4"/>
  <text class="h" x="762" y="951" text-anchor="middle">LexisNexis / loss history — prior loss, VIN facts</text>

  <rect class="partner-row" x="440" y="968" width="644" height="36" rx="4"/>
  <text class="h" x="762" y="991" text-anchor="middle">Insurance / industry data — carrier and market refs</text>

  <rect class="partner-row2" x="440" y="1008" width="644" height="36" rx="4"/>
  <text class="h" x="762" y="1031" text-anchor="middle">Estimating — damage line in, range or null out</text>

  <!-- Facts back onto the claim -->
  <path class="mcp" d="M420 942 H280 V788"/>
  <text class="lab" x="300" y="870">facts → claim</text>

  <!-- History / eval loop -->
  <path class="loop" d="M234 788 V860 H32 V1360"/>
  <path class="loopend" d="M32 1360 H96"/>
  <text class="lab" transform="translate(14,1280) rotate(-90)">claim history</text>

  <path class="loopend" d="M234 860 V1140"/>
  <text class="lab" x="246" y="1128">record</text>

  <!-- photo path skirts left of partner adjunct -->
  <path class="loopend" d="M590 788 V818 H404 V1140"/>
  <text class="lab" x="416" y="1112">photo</text>

  <rect class="run" x="96" y="1140" width="500" height="100" rx="8"/>
  <text class="h" x="346" y="1178" text-anchor="middle">Live pairs + eval scores</text>
  <text class="s" x="346" y="1204" text-anchor="middle">accept/correct → labeled pair · realtime scores</text>

  <rect class="db" x="96" y="1280" width="500" height="100" rx="8"/>
  <text class="h" x="346" y="1318" text-anchor="middle">up to 3 years claim history</text>
  <text class="s" x="346" y="1344" text-anchor="middle">adjuster accepted or corrected · offline held-out</text>

  <path class="loop" d="M596 1190 H640 V1330 H596"/>
  <path class="loopend" d="M640 1190 H800"/>
  <path class="loopend" d="M640 1330 H800"/>
  <text class="lab" x="652" y="1264">corpus</text>

  <rect class="train" x="800" y="1140" width="464" height="100" rx="8"/>
  <text class="h" x="1032" y="1178" text-anchor="middle">live pairs → retrain</text>
  <text class="s" x="1032" y="1204" text-anchor="middle">scheduled SFT refresh · optional RLHF prefs</text>

  <rect class="train" x="800" y="1280" width="464" height="100" rx="8"/>
  <text class="h" x="1032" y="1318" text-anchor="middle">history → SFT (pre-prod)</text>
  <text class="s" x="1032" y="1344" text-anchor="middle">photo + notice → kept estimate</text>

  <path class="loop" d="M1264 1190 H1320"/>
  <path class="loop" d="M1264 1330 H1320"/>
  <path class="loopend" d="M1320 1330 V276 H716 V344"/>
  <text class="lab" x="760" y="268">eval scores → promote</text>
</svg>
