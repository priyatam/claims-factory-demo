<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claims Factory - an agentic AI system for auto claims</title>
<style>{{STYLE}}</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Claims Factory</h1>
    <p>An agentic AI system for auto claims</p>
  </div>
</header>
<main>
  <section>
    <h2>Get a repair range from one photo.</h2>
    <p class="note">One photo, 3 MB or less. The cost is a visual range, not a settlement offer.</p>
  </section>
  <form id="claim">
    <div>
      <label for="policy">Policy code</label>
      <input id="policy" type="text" maxlength="10" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    </div>
    <div>
      <label for="file">Photo (JPEG, PNG, or WebP)</label>
      <input id="file" type="file" accept="image/jpeg,image/png,image/webp" required>
    </div>
    <button id="go" type="submit">Submit</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="record" class="box record" hidden>
    <h3>Claim record</h3>
    <dl id="record-list"></dl>
  </section>
</main>
<script>{{SCRIPT}}</script>
</body>
</html>
