# Public host for the one uvicorn process. Not an agent runtime.
# API key is a secret, set later with: fly secrets set ANTHROPIC_API_KEY=...
app = "vehicle-claims"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  ANTHROPIC_MODEL = "claude-sonnet-5"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
